---
layout: default
---
<article>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: '%Y-%m-%d' }}
    {% for tag in page.tags %}
      <a class="tag" href="{{ '/' | relative_url }}#{{ tag }}">{{ tag }}</a>
    {% endfor %}
  </div>

  {{ content }}
</article>
