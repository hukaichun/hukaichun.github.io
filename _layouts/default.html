<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% if page.layout == 'post' %}{% include katex.html %}{% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="site-brand">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <span class="site-subtitle">{{ site.description }}</span>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">文章</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">&copy; {{ site.time | date: '%Y' }} {{ site.author }} · {{ site.title }}</div>
  </footer>

  {% if page.layout != 'post' %}<script src="{{ '/assets/js/main.js' | relative_url }}"></script>{% endif %}
</body>
</html>
